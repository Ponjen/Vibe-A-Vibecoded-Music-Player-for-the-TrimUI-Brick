# Theme colors, one per line:   Name=GLOW,BACKGROUND,BARS    (hex RRGGBB, no #)
#   GLOW        selection glow, visualizer, progress bar, tab underline
#   BACKGROUND  browse screens (Albums / Artists / Songs)
#   BARS        top bar, bottom bar and menu boxes
# BACKGROUND and BARS are optional (or leave a field empty, e.g. "Name=FF00FF,,202030"):
# when missing they are calculated from the glow color.
# A name that already exists replaces that theme; a new name adds a theme to the Theme menu.
# The "Default" theme can't be edited (glow follows the album art, black background).
# Reopen the app after editing.
