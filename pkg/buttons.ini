# Joystick button indices. If a button does nothing, create an empty file named
# "debug" in this folder, press the button, and read input.log for its number.
A=1
B=0
X=3
Y=2
L1=4
R1=5
SELECT=6
START=7
MENU=8
# Backlight value restored after "screen off" if it can't be read back (0-255)
brightness=128

# ---- Background hotkeys (only active while the player is hidden / in background) ----
# Hold the first button(s), then press the last. Add @ms for a long press, e.g. MENU+SELECT@800
# Note: MENU+SELECT is the stock OSD shortcut, so the defaults avoid SELECT.
hk_pause=MENU+START
hk_next=MENU+R1
hk_prev=MENU+L1
# Show a stock OSD toast ("Paused", song title). 0 to disable.
toast=1
# The hotkeys read /dev/input/js0, whose button numbers may differ from the ones above.
# If a hotkey doesn't react: create an empty file named "debug", press the buttons,
# read input.log ("js button=N"), then set e.g. js_MENU=N, js_R1=N, js_L1=N, js_START=N here.

# ---- L2 / R2 (cycle the visualizer on the now-playing screen) ----
# On the Brick the triggers are usually analog axes 2 and 5. If they don't react,
# check input.log (create an empty "debug" file) and set axis_l2= / axis_r2=,
# or, if your L2/R2 are plain buttons, set L2=<n> and R2=<n> above.
axis_l2=2
axis_r2=5

# ---- Screen off ----
# While the screen is off, ONLY the SELECT button wakes it; every other button is ignored.
# If the panel doesn't go fully dark on your Brick, set shell commands that do what the stock OS does,
# for example:   screen_off_cmd=echo 0 > /sys/class/disp/disp/attr/lcdbl
#                screen_on_cmd=echo "lcd0 1 120" > /sys/class/disp/disp/attr/lcdbl
screen_off_cmd=
screen_on_cmd=

# ---- Screen-off methods (1 = use, 0 = don't) ----
# Run screentest.sh over SSH to see which method really turns your panel off, then disable the others.
screen_ioctl=1
screen_backlight=0
screen_blank=0

# ---- Clock in the top bar: 0 = 24 hour, 1 = 12 hour ----
clock_12h=0

# ---- Visualizer smoothness ----
# Milliseconds per visualizer frame: 33 = 30 fps (default), 16 = 60 fps (smoothest, more CPU/GPU), 40 = 25 fps.
# Raise it if audio stutters with a visualizer on.
vis_ms=33

# ---- Audio diagnostics ----
# Writes audio.log in the app folder when playback glitches (underruns, late audio callbacks, lock waits).
# Set to 0 once the stutter is solved.
audio_log=1

# ---- Downloader (MENU > Download music) ----
# Needs Wi-Fi. Files go to Music/Downloads as 320 kbps MP3 with tags and cover art.
# Tools live in the "bin" folder: yt-dlp, qjs (QuickJS) and ffmpeg (must include the LAME MP3 encoder).
# "Update downloader" in the Download menu runs "yt-dlp -U"; do that whenever YouTube downloads stop working.
# Tip: put one link per line in Music/Downloads/links.txt and use "Import links.txt".
# Wi-Fi activity can make audio stutter, so downloading while music plays may glitch.

# ---- LEDs ----
# MENU > "LED sync" makes the Brick's LEDs follow the on-screen glow color. The stock LED switch (OSD / settings) is respected,
# and the stock colors are restored when the app is hidden (a game starts) or closed.
# 1 = LEDs go dark while the screen is off, 0 = leave them on.
led_screen_off=1

# screen_blank=1 additionally blanks the framebuffer when the screen turns off. It is off by default because after waking,
# the OS overlays (OSD menu, volume / brightness popups) stayed invisible. Only turn it on if your screen doesn't go fully dark.

# Screen off works like the stock OS: brightness is set to 0 through /dev/disp and put back on wake. If the screen is not
# fully dark, try screen_backlight=1 (also cuts the backlight). That is extra and may upset the OS brightness keys.
